name = "midvash-mcp"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

# Rate limit por IP (auditoria de segurança): endpoint POST sem cache e que
# aceita batch JSON-RPC. namespace_id distinto do apps/web (que usa 1001-1003).
[[unsafe.bindings]]
name = "RATE_LIMIT_MCP"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

# Teto agregado, com chave fixa. O limite por IP acima não segura abuso
# distribuído por muitos IPs. O contador do binding é local a cada localidade
# da Cloudflare (documentado), então isto é um teto por datacenter — não um
# teto global, mas impede que um único colo dispare o custo sozinho.
[[unsafe.bindings]]
name = "RATE_LIMIT_GLOBAL"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 1200, period = 60 }

# Custom domain
routes = [
  { pattern = "mcp.midvash.com", custom_domain = true }
]

# R2 Bucket Binding (mesmo bucket usado pela api-publica)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bible"

# D1 — índice do MCP: versículos (FTS5 + trigrama) e material de estudo.
#
# Banco próprio, não o `midvash-search` do app web. Três motivos, em
# scripts/mcp-search-schema.sql: atribuição de custo (o painel reporta métricas
# por banco), menor privilégio (binding de D1 entrega o banco inteiro, e aqui só
# há conteúdo público) e independência do pipeline do site.
#
# Somente leitura pelo Worker. A carga é scripts/seed-mcp-search.sh.
[[d1_databases]]
binding = "SEARCH_DB"
database_name = "midvash-mcp-search"
database_id = "e00cefd7-918d-4bcd-9c98-30e5f5f39959"

# Observability - Logs e traces para debug
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
